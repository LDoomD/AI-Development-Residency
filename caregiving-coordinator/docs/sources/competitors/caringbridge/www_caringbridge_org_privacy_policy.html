ion ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"you","marks":[],"data":{}},{"nodeType":"text","value":" ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"choose to include on your individual page or in your comments or other content, including age, marital status, race, ancestry, ethnic origin, religion, philosophical beliefs, medical conditions, gender, gender identity, sex, sexual orientation, disability, political opinions, criminal allegations, and veteran or military status. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Commercial information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":", including records of personal property, products or services purchased, obtained, or considered, or other purchasing or consuming histories or tendencies. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Internet or other electronic network activity information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":", including browsing history, search history, and information regarding your interactions with our website, applications, or advertisements. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Geolocation data","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":", for example, as inferred from your IP address via tracking technologies on our website. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Audiovisual information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":", including photos and videos you choose to share through our Service. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Professional or employment-related information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Inferences","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" derived from the other categories of personal information we collect. ","marks":[],"data":{}}]}]}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"How We Collect Personal Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Generally, we collect the categories of personal information listed above as follows: ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Personal Information You Provide","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" CaringBridge collects personal information you voluntarily provide when you use our Service. For example, the personal information you provide when you post content on an Individual Page, complete a survey, make a donation, or contact our customer care personnel. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Account Creation","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" If you choose to create an account with us, you will need to provide certain personal information such as your name, email address, and other contact information. If you register for or sign into our Service using a third-party account (such as your Google, Apple, or social media account), CaringBridge will access, collect, and store certain personal information associated with your third-party account, including your first name, last name, email address, and profile picture. Upon request, CaringBridge will also access, collect, and store your contacts. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Information Automatically Collected From Your Mobile Device or Web Browser","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". ","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"We collect information that is sent to us automatically by your web browser and through our mobile application. This may include your IP address, the identity of your Internet service provider, the name and version of your operating system, the name and version of your browser, the date and time of your visit, the pages you visit on our website, and information about how you interact with our website or mobile app. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Personal Information Provided by Other Users","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Our Service facilitates the sharing of information to help families and friends stay connected during a health challenge. As such we may receive personal information about you from your friends and family. Under our Terms of Use, users are required to obtain your permission before posting submissions that contain your image, name, or likeness. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Personal Information Received from Service Providers and Third Parties","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". In the course of operating our organization, we work with vendors that collect personal information on our behalf; for example, service providers that conduct surveys or market research, or perform analytics on our behalf. We may also receive personal information from third-party sources such as other organizations whose missions align with ours, government sources, social media platforms, advertising networks, internet service providers, and data brokers. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Cookies and Similar Technologies","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We use cookies and other tracking technologies (such as web beacons) to collect and store information about your interactions with our website, including information about your browsing behavior. Our website also supports cookies placed by our service providers and third parties, such as advertising partners. This means that our service providers and third parties (such as our advertising partners) can collect and use information regarding your interactions with our website as further detailed below. Cookies are small files that a website transfers to your device through a web browser that enable the website’s or a third party’s systems to recognize your device and capture and remember certain information. Web beacons (also known as tracking pixels) are tiny graphics embedded invisibly on a webpage or in an email that may be used to deliver or communicate with cookies, to count users who have visited certain pages, and to understand usage patterns. In general, we use cookies and other tracking technologies as follows: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Where necessary to run our website ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"To optimize the functionality of our website ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"For analytics purposes ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"For purposes of ad targeting and marketing ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"To determine if our email messages have been opened and acted upon ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Cookies vary in how long they last. “Session cookies” terminate shortly after you terminate your internet session. “Persistent cookies” are stored on your device until a set expiration date. We use both session cookies and persistent cookies on our website. If you do not want to have cookies placed on your device, you should set your browser to refuse cookies before accessing our website. Please review your browser’s Help menu for instructions, or visit ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"https://cookiepedia.co.uk/"},"content":[{"nodeType":"text","value":"https://cookiepedia.co.uk/","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":" for more information about cookies. Certain advertising tracking technology vendors may participate in the Digital Advertising Alliance (“DAA”) AdChoices Program and may display an Advertising Option Icon for Interest-based Ads that links to an opt out tool which allows you to exercise certain choices regarding ad targeting. You can learn more about the DAA AdChoices Program at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"http://www.youradchoices.com/"},"content":[{"nodeType":"text","value":"http://www.youradchoices.com/","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":" and its opt out program for mobile apps at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"http://www.aboutads.info/appchoices"},"content":[{"nodeType":"text","value":"http://www.aboutads.info/appchoices","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Analytics","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We use analytics tools to analyze how you interact with our website. This software collects information such as your IP address, location, operating system, access time, duration of visit, and actions you take on our website. These tools may be owned and controlled by third parties. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Session Replay","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We may use session recording and replay technology to observe your mouse movements, scrolling, and clicks on our website. We use these tracking tools for support and analytics purposes, to inform our marketing, and to better understand how people engage with our site. This information is often collected and processed by our vendors who we have engaged to analyze this information on our behalf. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Do Not Track Signals","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[],"data":{}},{"nodeType":"text","value":" ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"Our website does not respond to “Do Not Track” signals sent by browsers, mobile devices, or other mechanisms. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"How We Use Personal Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Generally, we use the personal information we collect through the Service to: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Provide the Service, including hosting the content posted on an Individual Page and facilitating sharing of that content with other users; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Communicate with you regarding the Service, including for example, to notify you about updates to Individual Pages or content, to invite you to participate in surveys and provide feedback to us, to send you news and information we believe will be of interest to you, and to contact you regarding volunteer opportunities; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Solicit your financial support for the CaringBridge mission; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Better understand your needs and interests, and perform analytics on the data hosted on the Service, including Individual Pages; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Improve the content, functionality and usability of the Service; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Provide you with a personalized experience when you use the Service; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Engage in advertising and marketing. ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"In addition to the purposes described above, we may use and disclose any category of personal information we collect to respond to law enforcement requests, or as otherwise required or authorized by applicable law, court order, or governmental regulations; to protect our rights and interests and those of others; to resolve any disputes; to enforce our policies; and to evaluate or conduct a merger, sale, acquisition, or other disposition of some or all of our assets. We also reserve the right to use personal information we collect for any other purpose identified in an applicable privacy notice, click-through agreement, or other agreement between you and us, or otherwise with your consent. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We may convert, or permit others to convert, personal information into deidentified, anonymized, or aggregated data, as permitted by law. When we do so, we commit to maintaining the information in deidentified form, and will not attempt to reidentify the information. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Individual Pages and Publicly Available Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Individual Pages","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Our Service allows you to create and maintain a personal, individual page on behalf of yourself or another person (“Individual Page”). You may also post content to an Individual Page created by someone else. When it comes to sharing personal information across our platform, our goal is to balance our users’ need to find and communicate with each other with our users’ desire for a measure of privacy. Depending on the privacy settings in place for an Individual Page, content that you choose to post may be visible to the creator of the page, other individuals, us, our service providers, third parties, and the public. Every member of a caring community, including the creator of an Individual Page and all users who interact with an Individual Page, is responsible for maintaining appropriate confidentiality, choosing what to share, and disclosing the website address of an Individual Page in accordance with the subject’s wishes. If you have concerns about sharing certain types of content with others, you should not post that content to an Individual Page. Please see the section on ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"bookmark://_Privacy_Rights_and"},"content":[{"nodeType":"text","value":"Privacy Choices and Options","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":", below, for information on how to adjust the privacy settings for Individual Pages. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Other Public Parts of Our Service","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" Our Service also offers publicly accessible blogs and community forums where you may choose to post information or where we may post information about you with your consent. Please do not post any content that you are not comfortable sharing publicly. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Public Profile and Search Features","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We offer a search feature on our Service that allows other users to find a public profile for your Individual Page on our Service and on the public Internet—for example, through general-purpose search engines. The information visible within a public profile includes: (1) the first and last name and the subject of the Individual Page; (2) the title of the Individual Page; (3) the profile picture of the Individual Page; (3) the date and time of the first post to the Individual Page; and (4) the date and time of the most recent post to the Individual Page. This public profile will be indexed and displayed through public search engines. You have the option to control the settings for the public profile feature when you initially create an Individual Page or at any time during the lifetime of the Individual Page by going to “Page Settings.” ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Retention of Personal Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We keep your personal information for as long as necessary or permitted for the purposes described in this Privacy Policy or otherwise authorized by law. This generally means holding the information for as long as one of the following applies: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Your personal information is reasonably necessary to manage our operations, to manage your relationship with us, or to satisfy another purpose for which we collected the information; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Your personal information is reasonably necessary to carry out a disclosed purpose that is reasonably compatible with the context in which the personal information was collected; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Your personal information is reasonably necessary to protect or defend our rights or property (which will generally relate to applicable laws that limit actions in a particular case); or ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We are otherwise required or permitted to keep your personal information by applicable laws or regulations. ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Where personal information is used for more than one purpose, we will retain it until the purpose with the latest period expires. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"How We Disclose Personal Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"This section summarizes the ways in which we disclose personal information about users. Generally, the purposes for which we disclose personal information are consistent with the purposes for which we collect the information as discussed above. To carry out these purposes, we disclose personal information in the following circumstances: ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Individual Page Creators","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" When you interact with an Individual Page, such as by posting content or making a donation, we may share your name, email address, and content you submit with the page’s creator. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Vendors","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" CaringBridge may disclose personal information to service providers that we use to support our business and operations. These vendors include financial institutions, technical support, analytics, media and marketing, web-related services, and other vendors that help us to operate the Service. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Online Chat","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" Our Service may include online chat features to assist with answering questions and providing you with relevant information. When you participate in an interactive chat, either with a virtual or live agent, the contents of the chat may be captured and kept as a transcript. By using an online chat feature, you understand that our vendors may process the information obtained through the chat feature in order to provide services on our behalf. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Visitors to Your Individual Page","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" As discussed in more detail under ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"bookmark://_Individual_Pages_and"},"content":[{"nodeType":"text","value":"Individual Pages and Publicly Available Information","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":", above, information posted to an Individual Page may be available to other CaringBridge users or the general public, depending on the privacy settings chosen for the Individual Page. For example, if you choose to activate the public search listing feature for your Individual Page, certain information about you will be made available to general-purpose search engines. Please be aware that any personal information you share online may be stored, indexed, or archived by third parties and could remain accessible on the internet indefinitely. Even if you delete content, copies may persist in backups, caches, or other systems beyond your control. Exercise caution when sharing sensitive details. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Blog/Forum","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" Our Service offers publicly accessible blogs and community forums. You should be aware that any information you provide in these areas may be read, collected, and used by others who access them. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Business Transfers","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" Your personal information may be transferred to a successor organization if, for example, we transfer the ownership or operation of our Service to another organization or if we merge with another organization. If such a transfer occurs, the successor organization’s use of your personal information will still be subject to this Privacy Policy. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Compliance with Laws and Protection of Our Rights and the Rights of Others","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" We may disclose your personal information when we, in good faith, believe disclosure is appropriate to comply with the law, a court order or a subpoena. We may also disclose your personal information to prevent or investigate a possible crime, such as fraud or identity theft; to protect the security of our Service; to enforce or apply our online Terms of Use or other agreements; or to protect our own rights or property or the rights, property or safety of our users or others. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"To Others with Your Consent","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" We may disclose your personal information to others with your consent. For example, we display personal testimonials and endorsements of satisfied users on our site. If you provide a testimonial and wish to update or deactivate it, you can contact us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". We also offer a Connecting Caregivers Program which you can use to meet other CaringBridge users who are on a health journey similar to yours or may otherwise be beneficial for you to connect with. Participation in the Connecting Caregivers Program is voluntary and involves the disclosure of information about you to the user(s) you match with, including your name and contact information, demographic information, and information relating to health conditions that you authorize us to disclose. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Privacy Choices and Options","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Privacy Settings for Individual Pages","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Creators of Individual Pages can control what parts of their Individual Pages are visible to other users and the public. You may increase the privacy of the Individual Page by making it accessible “By Invitation Only.” This setting can be changed at any time during the lifetime of the Individual Page by going to “Page Settings.” ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You also have the option to activate or deactivate the public profile feature that allows your Individual Page to be located by others when using online search engines. Options for controlling public profile information are found under “Page Settings” within your account profile. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Correction and Removal of Information","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". ","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":"You may correct certain personal information by making the change directly in your account. You may deactivate your Individual Page in Page Settings or ask us to deactivate it by contacting us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". There is an option for recovery when your Individual Page is deactivated. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you would like to permanently delete your Individual Page, you may ask us to delete it by contacting us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". There is no option for recovery when your Individual Page is deleted. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"It may take up to 90 days to delete all the activity on an account or an Individual Page. While the deletion process is in progress, the account or Individual Page is deactivated and inaccessible to you or other CaringBridge users. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Email Communications","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" We occasionally send information about products, services, newsletters and promotions on our Service. If you currently receive our newsletter and promotional communications and no longer wish to, you may opt out of/withdraw your consent to receiving them by clicking the Unsubscribe link included in our commercial emails and following the instructions provided or by emailing us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Text Messages.","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":" We may send information about your account and our Services, including notifications of activity on your Page. If you no longer wish to receive these text messages, you may opt out of/withdraw your consent to receiving them by texting “Stop” in response. You may also remove your phone number by navigating to “Update Phone” within your account profile. We do not share information you provide to enroll in our text messaging services or programs with third parties for their marketing purposes. We may share your text messaging opt in information or consent status with service providers that help us administer our text messaging services, including but not limited to platform providers, phone companies, and other vendors who assist us in the delivery of text messages. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Notifications from our Mobile Application","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":".","marks":[{"type":"italic"}],"data":{}},{"nodeType":"text","value":" When using our mobile application, we will provide you with the opportunity to opt in to receiving notifications from us through your device. If you no longer wish to receive these communications, you may opt out of receiving them at the device level by modifying your app settings. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Connecting Caregivers Program. ","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":"If you choose to participate in our Connecting Caregivers Program, you may have the opportunity to directly connect with another member of the CaringBridge community. If you no longer wish to participate in the Program, please contact us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Other Inquiries","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". If you wish to update a testimonial, request removal of content from a public forum or blog, or ask a question about our privacy practices, please contact us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"State-Specific Privacy Rights","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Consumers in Delaware, Maryland, Minnesota, New Jersey, and Oregon","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"In addition to the options above, you may have privacy rights under the law of the state in which you live. This section describes the rights of consumers in Delaware, Maryland, Minnesota, New Jersey, and Oregon (collectively, “Covered States”). ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you reside in a Covered State and would like to submit a request relating to your personal information, please use our email us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". Depending on the nature of your request, we may require some personal information from you in order to verify your identity. If you have a password-protected account with us, we may verify your identity through our existing authentication practices for your account. In some states and for some types of requests, you may designate an authorized agent to make a request on your behalf; however, for certain requests you will still need to verify your identity directly with us before your request can be processed. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Right to Access and Data Portability","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". You may confirm whether we are processing your personal information, access your personal information, and obtain a copy of personal information in a portable format. If you are a resident of a Covered State, you may also request that we provide you with information about the categories or specific third parties to which we disclosed personal information. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Right to Request Deletion of Personal Information","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Subject to certain exceptions, you may request that we delete your personal information. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Right to Request Correction of Personal Information","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". You may request that we correct inaccuracies in your personal information, taking into account the nature of the personal information and our purposes for processing it. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Right to Opt Out","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". You may opt out of the following uses of your personal information: (a) targeted advertising; (b) the sale of personal information; and (c) profiling in furtherance of decisions that produce legal or similarly significant effects concerning your economic situation, health, personal preferences, interests, reliability, behavior, location, or movements. Some of the ways in which we process personal information to connect users with health-related support services may be considered profiling in Covered States. Consumers who wish to opt out may do so via the email address provided above. Additionally, Minnesota consumers have the right question the results of the profiling, be informed of the reason that the profiling resulted in the decision, and if feasible, be informed of what actions could have been taken to secure a different decision, and the actions that can be taken to secure a different decision in the future. Minnesota residents also have the right to review the personal information used in the processing and, if it is inaccurate, have the profiling reevaluated. Although we do not sell personal information in exchange for money, some of the ways in which we share personal information for targeted advertising may be considered “sales” under the Covered States privacy laws. Listed below are the categories of personal information we share for purposes of targeted/cross-context behavioral advertising or otherwise “sell” for non-monetary consideration: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Identifiers ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Personal records ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Commercial information ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Internet or other electronic network activity information ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Geolocation data ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Inferences ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The types of third parties to which personal information is sold or shared are third-party advertisers, partner businesses, and some analytics vendors. The purposes for which we sell/share this information include: showing you relevant ads while you browse the internet or use social media; marketing and advertising our or partner organizations’ products and services; certain types of analytics; or similar purposes. We do not have actual knowledge that we sell or share the personal information of consumers under 18 years of age. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you would like to opt out, please click the “Your Privacy Choices” link in the footer of our website. You may also exercise your right to opt of sales and sharing via an opt out preference signal. If you choose to use the Global Privacy Control (GPC) browser signal you will need to turn it on for each browser you use. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Right to Appeal","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Sometimes we are unable to process requests relating to your personal information, in which case, your request will be denied. If your privacy rights request has previously been denied by us and you believe we denied it in error, you may appeal for reconsideration of your request. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Connecticut, Washington, and Nevada Consumer Health Data Privacy Notice","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"“Consumer Health Data” means personal information that is linked or reasonably linkable to a Consumer and that is used to identify the past, present or future health status of the Consumer. We collect the following categories of Consumer Health Data: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Individual health condition, status, treatment, disease, or diagnosis information; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Social, psychological, behavioral, and medical interventions; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Health-related surgeries or procedures; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Use or purchase of prescribed medication; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Diagnoses or diagnostic testing, treatment, or medication; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Gender-affirming care information; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Reproductive or sexual health information; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Contact information and other information used to identify an individual. ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Purposes for Collection and Use of Consumer Health Data","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We Collect and use the Consumer Health Data described above to the extent necessary to provide our Service, including the hosting of Individual Pages on our Service, providing or connecting you with services that may be relevant or of interest, or otherwise with your consent. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Sources of Consumer Health Data","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We collect the Consumer Health Data described above from users who post it on our Service. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Sharing of Consumer Health Data","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". We do not sell Consumer Health Data. We will only share Consumer Health Data as reasonably necessary to provide our Service and meet our other obligations or as you direct, for example, we may disclose Consumer Health Data to: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Our processors to provide goods and services in a manner consistent with the purpose for which the Consumer Health Data was collected and disclosed; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"External parties as an asset that is part of a merger, acquisition, bankruptcy, or other transaction in which the party may assume control of all or part of our assets; ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Otherwise as you direct or with your consent, such as connecting you with another individual as part of our Connecting Caregivers Program. ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Consumer Health Data Rights","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Washington and Nevada residents and individuals whose Consumer Health Data is collected in Washington may submit certain requests relating to your Consumer Health Data by emailing us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". Requests you may make relating to Consumer Health Data are subject to a verification process. We will not fulfill your request unless you have provided sufficient information for us to reasonably verify you are the Consumer whose Consumer Health Data we collected. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"International Users","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"As a supplement to the other parts of this Privacy Policy, we provide the following additional information for users outside of the United States. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Data Transfers","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". CaringBridge operates and is based in the United States. If you are using our Service outside the United States, please be aware that information we obtain about you will be transferred to and processed in the United States and may be accessed by the courts, law enforcement, and national security authorities here. By using our Service or otherwise providing your personal information to us, you acknowledge and consent to the international transfer and processing of your personal information as described in this Policy. Please be aware that the data protection laws and regulations that apply to your personal information transferred to the United States may be different from the laws in your country. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Our Legal Bases for Personal Information","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". Other sections of this Privacy Policy describe the types of personal information we collect and our purposes for processing personal information.","marks":[],"data":{}},{"nodeType":"text","value":" ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"When we process your personal information, we do so under the following legal bases: ","marks":[],"data":{}}]},{"nodeType":"unordered-list","data":{},"content":[{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We process personal information to achieve our ","marks":[],"data":{}},{"nodeType":"text","value":"legitimate interests","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" of providing, improving, and personalizing the experiences of users of our Service. We also process personal information to help ensure the security and integrity of our Service. When we rely on our legitimate interests, we take into account the effects that these actions might have on you. If you have questions about our decisions regarding our legitimate interests, you may contact us. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"You have ","marks":[],"data":{}},{"nodeType":"text","value":"consented to","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" our processing of your personal information. For example, we may rely on consent to use non-essential cookies, to send you marketing communications, or if we need to collect sensitive personal information from you. When you consent, you may change your mind and withdraw your consent at any time by emailing us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"The processing is ","marks":[],"data":{}},{"nodeType":"text","value":"necessary for us to provide our Service ","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":"or","marks":[],"data":{}},{"nodeType":"text","value":" perform our contractual obligations","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":". For example, we may rely on this legal basis in relation to performance of our obligations under our Terms of Use, meeting promises to our donors, or in relation to providing you with a user profile. ","marks":[],"data":{}}]}]},{"nodeType":"list-item","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"We have a ","marks":[],"data":{}},{"nodeType":"text","value":"legal obligation","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" to process your personal information, such as compliance with applicable laws, regulations, or court orders. ","marks":[],"data":{}}]}]}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Privacy Rights","marks":[{"type":"italic"},{"type":"bold"}],"data":{}},{"nodeType":"text","value":". In addition to the options described under ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"bookmark://_Privacy_Choices_and"},"content":[{"nodeType":"text","value":"Privacy Choices and Options","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":", you may have additional privacy rights under the law of country or region in which you live, including the right to access, correct, erase, and obtain a copy of personal information we maintain about you; object to or restrict our processing of your personal information; or receive written information about our policies and practices regarding service providers outside of your country. You may submit these requests by emailing us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". We may require specific information from you to help us verify your identity prior to processing your request. Applicable law may require or permit us to decline your request. If we decline your request, we will tell you why, subject to any legal restrictions on disclosing this information. If you are not satisfied with how we manage your personal information, you may contact us at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":" or submit a complaint to your local data protection authority. If you reside in the EU or EEA, you can find information about your data protection authority ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"https://edpb.europa.eu/about-edpb/about-edpb/members_en"},"content":[{"nodeType":"text","value":"here","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". If you reside in the UK, you may file complaints with the Information Commissioner’s Office ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"https://ico.org.uk/make-a-complaint/"},"content":[{"nodeType":"text","value":"here","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":". ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Third-Party Links and Services","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Our Service may include links to third-party websites. When you click on these links, you are leaving our Service and navigating to a site operated by another company and subject to their privacy policy. Our Service may also include social media buttons or widgets which allow you to share or otherwise easily transfer content from our website to social medial platforms (“Social Media Features”). We may also partner with third parties that support donations to loved ones, charitable causes, and/or CaringBridge (“Donation Features”). These Social Media and Donation Features may collect your IP address, which pages you are visiting on our Service and other information, and may set cookies to enable the Social Media and Donation Feature to function properly or track your activity on our Service. Social Media and Donation Features are either hosted by a third party or hosted directly on our website. Your interactions with these Social Media and Donation Features are governed by the privacy policy of the third-party social media platform and the privacy settings you have selected on their platform. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Children","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Special care must be taken to protect the privacy of children. For this reason, CaringBridge does not permit children under the age of 18 to register as users or interact with our online Services. We also ask that you do not post any personal information regarding children unless you have a parent or guardian’s permission. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Security","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"At no cost to you, we maintain reasonable administrative, physical and technological measures to protect the confidentiality and security of your personal information. Unfortunately, no website, server or database is 100% secure. Therefore, we cannot guarantee its absolute security. Likewise, if information on an Individual Page is made public, we cannot safeguard or protect that information from access by others. For this reason, you should use care and discretion when you post content on an Individual Page. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Updates to This Privacy Policy","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"This Privacy Policy describes CaringBridge’s current policies and practices regarding the personal information we collect through the Service. Periodically, we will update or revise this Privacy Policy. If we make any changes, we will notify you by posting the revised version of this Privacy Policy and updating the “Effective Date” at the top of this page. If we make material changes such that additional notice steps are required by applicable law, we will notify you or seek your consent by email (sent to the email address specified in your account), by means of a prominent notice on this website, or otherwise in accordance with applicable law. ","marks":[],"data":{}}]},{"nodeType":"heading-3","data":{},"content":[{"nodeType":"text","value":"Contact Us","marks":[{"type":"bold"}],"data":{}},{"nodeType":"text","value":" ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"If you have any questions about this Privacy Policy or our privacy practices, please contact us by email at ","marks":[],"data":{}},{"nodeType":"hyperlink","data":{"uri":"mailto:customercare@caringbridge.org"},"content":[{"nodeType":"text","value":"customercare@caringbridge.org","marks":[{"type":"underline"}],"data":{}}]},{"nodeType":"text","value":" or by mail at CaringBridge, 3600 American Boulevard West, Suite 405. Bloomington, MN 55431, Attn: Privacy and Data Protection Officer. ","marks":[],"data":{}}]},{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"","marks":[],"data":{}}]}]}}}]},"tipsCollection":{"__typename":"PageTipsCollection","items":[]},"tabsCollection":{"__typename":"PageTabsCollection","items":[]},"tribute":null,"tributeInline":null,"tributeThanks":null,"globalData":{"popup":null},"tributeModal":{"sys":{"id":"41hCp1cojueE7qwtdq80Zt","__typename":"Sys"},"__typename":"TributeModal","headerText":{"json":{"nodeType":"document","data":{},"content":[{"nodeType":"paragraph","data":{},"content":[{"nodeType":"text","value":"Every tribute gift helps another family stay connected when they need it most.","marks":[],"data":{}}]}]},"__typename":"TributeModalHeaderText"},"image":null,"name":"Tribute Modal","textColor":null,"backgroundColor":null,"desktopFontSize":null,"mobileFontSize":null,"buttonText":null}}},"__N_SSG":true},"page":"/legal/privacy-policy","query":{},"buildId":"-e9AShTcWPQ7K4zA9L_V9","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
